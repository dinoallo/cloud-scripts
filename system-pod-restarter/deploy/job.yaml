apiVersion: batch/v1
kind: Job
metadata:
  name: system-pod-restarter
  namespace: system-pod-restarter
  labels:
    app.kubernetes.io/name: system-pod-restarter
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: system-pod-restarter
    spec:
      serviceAccountName: system-pod-restarter
      restartPolicy: Never
      containers:
        - name: restarter
          image: ghcr.io/dinoallo/system-pod-restarter:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
