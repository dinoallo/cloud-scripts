apiVersion: v1
kind: ServiceAccount
metadata:
  name: system-pod-restarter
  namespace: system-pod-restarter
  labels:
    app.kubernetes.io/name: system-pod-restarter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system-pod-restarter
  labels:
    app.kubernetes.io/name: system-pod-restarter
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system-pod-restarter
  labels:
    app.kubernetes.io/name: system-pod-restarter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system-pod-restarter
subjects:
  - kind: ServiceAccount
    name: system-pod-restarter
    namespace: system-pod-restarter
