apiVersion: batch/v1
kind: Job
metadata:
  name: non-default-sa-token-restarter
  namespace: non-default-sa-token-restarter
  labels:
    app.kubernetes.io/name: non-default-sa-token-restarter
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: non-default-sa-token-restarter
    spec:
      serviceAccountName: non-default-sa-token-restarter
      restartPolicy: Never
      containers:
        - name: restarter
          image: ghcr.io/dinoallo/non-default-sa-token-restarter:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
